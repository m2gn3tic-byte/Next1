name: Build and publish game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot/engine.zip"
          printf '%s  %s\n' \
            a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c \
            "$RUNNER_TEMP/godot/engine.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .tools/godot/4.6.3.stable
          key: godot-web-4.6.3-${{ hashFiles('tools/install_web_templates.py') }}
      - name: Build browser game
        run: ./tools/build_web.sh
      - name: Test game rules and controls
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          ./tools/godot.sh --headless --script res://tests/run_tests.gd
          ./tools/godot.sh --headless --script res://tests/level_tests.gd
          ./tools/godot.sh --headless --script res://tests/progression_scene_tests.gd
          ./tools/godot.sh --headless --script res://tests/combat_economy_tests.gd
      - name: Install browser checks
        run: |
          python -m pip install -r tests/requirements-web.txt
          python -m playwright install --with-deps chromium
      - name: Test exported game in browser
        shell: bash
        run: |
          set -euo pipefail
          python tools/serve_web.py > "$RUNNER_TEMP/web-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8060/ > /dev/null; then break; fi
            sleep 1
          done
          python tools/verify_web.py http://127.0.0.1:8060 --expected-version "$(python tools/web_release.py fingerprint)"
          python tests/browser_smoke.py
          python tests/browser_economy.py
      - id: version
        name: Record release version
        run: echo "value=$(python tools/web_release.py fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published version
        run: python3 tools/verify_web.py '${{ steps.deployment.outputs.page_url }}' --expected-version '${{ needs.build.outputs.version }}' --attempts 6
