<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b132c">
  <meta name="description" content="Väike laev. Suur galaktika. Vii viis pakki koju ühe sõrmega juhitavas kosmoseseikluses.">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080e22; color: #fff4d9; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; background: radial-gradient(ellipse at 20% 40%, #242044 0, #080e22 65%); }
    #frame { position: relative; width: min(100vw, 56.25dvh); height: min(100dvh, 177.7778vw); box-shadow: 0 0 110px #0006; }
    #canvas { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px; padding: 32px; background: #0b132c; z-index: 5; }
    #loading h1 { font-size: clamp(24px, 5vw, 40px); letter-spacing: .06em; margin: 0; }
    #loading p { margin: 0; color: #9af5d3; }
    progress { width: min(70vw, 300px); height: 6px; margin: 14px auto; accent-color: #9af5d3; }
    #error { max-width: 35em; white-space: pre-line; line-height: 1.6; color: #ffbba5; }
    .orbit { font-size: 60px; color: #9af5d3; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="frame"><canvas id="canvas" tabindex="0" aria-label="Kosmosekuller. Alusta lendu Enteriga. Juhi nooleklahvide, hiire või puudutusega. P-klahv peatab mängu.">Mäng vajab WebGL 2 toega brauserit.</canvas></main>
  <div id="loading" role="status">
    <div class="orbit" aria-hidden="true">✦</div>
    <h1>KOSMOSEKULLER</h1>
    <p>Valmistame sinu laeva ette…</p>
    <progress id="progress"></progress>
    <div id="error"></div>
  </div>
  <noscript>Mängimiseks lülita brauseris JavaScript sisse.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const engine = new Engine(config);
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
    function showError(error) {
      console.error(error);
      document.getElementById('error').textContent = 'Mängu ei õnnestunud laadida. Ava mäng tänapäevases WebGL 2 toega brauseris HTTP või HTTPS kaudu.\n' + String(error.message || error);
      progress.hidden = true;
    }
    if (missing.length) {
      showError('Puuduv brauseritugi: ' + missing.join(', '));
    } else {
      engine.startGame({
        canvas: document.getElementById('canvas'),
        onProgress(current, total) {
          if (total > 0) { progress.max = total; progress.value = current; }
        }
      }).then(() => {
        loading.remove();
        document.getElementById('canvas').focus();
      }).catch(showError);
    }
  </script>
</body>
</html>
